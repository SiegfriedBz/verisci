      <stop offset="0" stop-color="#7eaaff"/>
      <stop offset="1" stop-color="#4cd0c4"/>
    </linearGradient>
  </defs>
  <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="9" fill="#0e131a" stroke="#7eaaff" stroke-opacity="0.35" stroke-width="1.5"/>
  <path d="M5.6 17H9.8l2.2-6.3 2.7 11.1 2.3-4.9 3.2 3.5 5.8-8.6" fill="none" stroke="url(#g)" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="25.9" cy="11.8" r="2" fill="#4cd0c4"/>
