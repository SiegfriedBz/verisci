<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <title>LabsTrail</title>
  <!-- LabsTrail's mark, as components/site/logo.tsx draws it, in fixed colours (the dark theme's blue and teal on its deep blue-grey tile) that read on light and dark browser tabs. -->
