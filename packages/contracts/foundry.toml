[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["dependencies"]
solc_version = "0.8.37"
evm_version = "prague"

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 64
depth = 50

[profile.ci.fuzz]
runs = 5000

[profile.ci.invariant]
runs = 256
depth = 50

# `pnpm check` runs `forge lint --deny notes`, so every finding below fails it (ADR 0025).
[lint]
severity = ["high", "medium", "low", "info", "gas"]
# Inline assembly for keccak256 saves a little gas per hash and costs readability.
exclude_lints = ["asm-keccak256"]

# remappings.txt is written by hand: update a dependency's path there when bumping it.
[soldeer]
remappings_generate = false
recursive_deps = false

[dependencies]
forge-std = "1.17.0"
"@openzeppelin-contracts" = "5.7.0"
