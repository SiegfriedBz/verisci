name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  ts:
    name: ts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm through Corepack
        run: corepack enable

      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - name: Format and lint
        run: pnpm biome ci

      - name: Typecheck
        run: pnpm typecheck

      - name: Test with coverage
        run: pnpm test:coverage

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

      - name: Build
        run: pnpm build
        env:
          # A production build must name its deployment; CI deploys nothing.
          APP_ENV: local

  contracts:
    name: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/contracts
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Enable pnpm through Corepack
        run: corepack enable

      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-${{ runner.os }}-

      - name: Install the contracts workspace
        run: pnpm install --frozen-lockfile --filter @verisci/contracts

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.8.4

      - name: Install Solidity dependencies
        run: forge soldeer install

      - name: Format, lint and NatSpec
        run: pnpm check

      - name: Build
        run: forge build --sizes

      # Vercel has no Foundry, so the ABI is committed; it must match the contract.
      - name: Generated ABI is current
        run: pnpm generate:abi && git diff --exit-code -- src/generated

      - name: Test
        run: forge test
        env:
          FOUNDRY_PROFILE: ci
